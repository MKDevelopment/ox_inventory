# ox_inventory settings for MyStoryRP
#
# Load this file in server.cfg BEFORE the resources start:
#
#   exec inv_setup.cfg
#   ensure oxmysql
#   ensure ox_lib
#   ensure es_extended
#   ensure inventory_images
#   ensure ox_inventory
#
# setr = replicated to clients (anything the game client or UI reads)
# set  = server only (keep webhooks and server logic here)
# JSON values must not contain spaces.

## Language and framework
setr ox:locale "pl"
setr inventory:framework "esx"
# ESX job keys used as inventory groups (shops, stashes, evidence); job2 for second jobs/gangs
setr inventory:esxjobs ["job","job2"]
# Police jobs (evidence lockers, police armoury, searching players)
setr inventory:police ["police","sheriff"]

## Player inventory (weights are in grams: 30000 = 30 kg)
setr inventory:slots 50
setr inventory:weight 30000
# Items dropped on the ground
setr inventory:dropslots 50
setr inventory:dropweight 30000

## Item images from the separate inventory_images resource
setr inventory:imagepath "https://cfx-nui-inventory_images/images"
setr inventory:imageformat "webp"

## Interaction and UI
# true when ox_target is used for stashes, shops, trunks and drops
setr inventory:target false
# Keys: primary inventory, other inventory, hotbar
setr inventory:keys ["F2","K","TAB"]
setr inventory:screenblur true
setr inventory:itemnotify true
setr inventory:weaponnotify true
setr inventory:disablesetupnotification true
# /steal on downed or hands-up players; leave it to rcore_police / RP rules
setr inventory:enablestealcommand false
# 1 = only the front seats can open the glovebox
setr inventory:gloveboxseatrestriction 1

## Weapons
setr inventory:weaponanims true
setr inventory:autoreload false
setr inventory:aimedfiring false

## Clothing as items (keep false until saveAppearance is set in data/clothing.lua)
setr inventory:clothingitems false

## Server: logging and loot
# 0 = off, 1 = moves between inventories, 2 = also items added/removed by other resources
set inventory:loglevel 1
set inventory:randomloot false
set inventory:randomprices false
# Minimum police grade that can take items from evidence lockers
set inventory:evidencegrade 2
# Delete stashes not used for this long (empty string keeps them forever)
set inventory:clearstashes "6 MONTH"
set inventory:versioncheck false

## Server: Discord webhooks (never use setr for these)
# Item images uploaded through metadata (imageurl)
set inventory:webhook ""
# Store purchases, till withdrawals and /stores admin changes
set inventory:storeswebhook ""
